<!DOCTYPE html> 
<html>  
   

<head>

<nav>
  <div class="nav-left">

    <button id="btn-take" onclick="doTake()">{↓}</button>
    <button id="btn-resources" onclick="openResources()">{g∈𝔾}</button>

  <span class="nav-hebrew">∀g∉𝔾</span>
 <div class="nav-logo">

<div class="mobile-menu" id="mobile-menu">

  <button onclick="openResources(); toggleMenu()"><strong>{ }</strong> (resources)</button>

<input type="file" id="file-input" accept="image/*" multiple="">

<div id="workspace-wrap">
  <div id="canvas-area">
    <div class="canvas-placeholder" id="placeholder">
      </svg>

    </div>
  </div>

    <div id="layer-list"></div>
    <div id="panel-actions">
      <button onclick="moveLayer(1)">↑</button>
      <button onclick="moveLayer(-1)">↓</button>
    </div>
  </div>
</div>

    <div class="preset-list" id="preset-list"><div class="preset-item">1300.png</div><div class="preset-item">Choose.png</div></div>

  </div>

<script src="script.js"></script>
